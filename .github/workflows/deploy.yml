name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]  # 当代码推送到 main 分支时触发
  workflow_dispatch:      # 允许手动在 GitHub 网页上触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2  # 指定 pnpm 版本，保持与本地开发一致

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0' # 使用你项目中指定的 Node 版本
          cache: 'pnpm'      # 关键：启用 pnpm 缓存，加速构建

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建项目
        run: pnpm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # 这里替换成你的实际构建输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4